<style>
  /* ============================================================
     GLOBAL CSS — Dark Luxe Design System
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #0a0a0f;
    --bg-2:         #111118;
    --bg-3:         #1a1a26;
    --card:         rgba(255,255,255,0.04);
    --card-hover:   rgba(255,255,255,0.08);
    --border:       rgba(255,255,255,0.08);
    --border-hover: rgba(79,142,247,0.5);
    --text:         #f1f5f9;
    --muted:        #94a3b8;
    --blue:         #4f8ef7;
    --gold:         #f0a500;
    --purple:       #8b5cf6;
    --red:          #ef4444;
    --green:        #10b981;
    --radius:       16px;
    --radius-lg:    24px;
    --glow-blue:    0 0 40px rgba(79,142,247,0.18);
    --glow-gold:    0 0 40px rgba(240,165,0,0.18);
    --t:            0.3s cubic-bezier(0.4,0,0.2,1);
    --font-display: 'Space Grotesk', 'Inter', sans-serif;
    --font-body:    'Inter', sans-serif;
    --max-w:        1200px;
    --header-h:     68px;
  }

  [data-theme="light"] {
    --bg:           #f4f6ff;
    --bg-2:         #ffffff;
    --bg-3:         #eef0fa;
    --card:         rgba(255,255,255,0.85);
    --card-hover:   rgba(255,255,255,1);
    --border:       rgba(0,0,0,0.10);
    --border-hover: rgba(79,142,247,0.45);
    --text:         #0f172a;
    --muted:        #475569;
    --glow-blue:    0 0 32px rgba(79,142,247,0.12), 0 4px 16px rgba(0,0,0,0.06);
    --glow-gold:    0 0 32px rgba(240,165,0,0.12),  0 4px 16px rgba(0,0,0,0.06);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
    transition: background var(--t), color var(--t);
    padding-top: var(--header-h);
  }

  a { text-decoration: none; color: inherit; }
  img { max-width: 100%; display: block; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  /* ============================================================
     SCROLL PROGRESS BAR
     ============================================================ */
  #progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    width: 0%;
    background: linear-gradient(90deg, var(--blue), var(--gold));
    z-index: 9999;
    pointer-events: none;
    transition: width 0.08s linear;
  }

  /* ============================================================
     SITE HEADER
     ============================================================ */
  #site-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    z-index: 1000;
    background: rgba(10,10,15,0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    transition: background var(--t), border-color var(--t), box-shadow var(--t);
  }

  [data-theme="light"] #site-header {
    background: rgba(244,246,255,0.85);
    border-bottom-color: rgba(0,0,0,0.08);
  }

  #site-header.elevated {
    background: rgba(10,10,15,0.92);
    box-shadow: 0 4px 40px rgba(0,0,0,0.4);
  }

  [data-theme="light"] #site-header.elevated {
    background: rgba(244,246,255,0.97);
    box-shadow: 0 2px 20px rgba(0,0,0,0.08), 0 1px 0 rgba(0,0,0,0.06);
  }

  .header-inner {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 2rem;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  /* Logo */
  .logo {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
    color: var(--text);
    flex-shrink: 0;
    transition: opacity var(--t);
  }
  .logo:hover { opacity: 0.85; }

  .logo-ring {
    width: 36px; height: 36px;
    border-radius: 50%;
    padding: 2px;
    background: linear-gradient(135deg, var(--blue), var(--gold));
    flex-shrink: 0;
  }
  .logo-ring img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--bg);
  }

  /* Desktop nav */
  #desktop-nav {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 1;
    justify-content: center;
  }

  #desktop-nav a {
    padding: 0.35rem 0.7rem;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--muted);
    transition: color var(--t), background var(--t);
    white-space: nowrap;
  }
  #desktop-nav a:hover { color: var(--text); background: var(--card); }
  [data-theme="light"] #desktop-nav a:hover { background: rgba(79,142,247,0.07); }

  /* Header actions */
  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    transition: all var(--t);
  }
  .icon-btn:hover {
    background: var(--card-hover);
    border-color: var(--border-hover);
  }
  .icon-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; }

  #menu-toggle { display: none; }

  /* Mobile nav */
  #mobile-menu {
    display: none;
    position: fixed;
    top: var(--header-h); left: 0; right: 0;
    background: rgba(10,10,15,0.97);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 1.25rem;
    flex-direction: column;
    gap: 4px;
    z-index: 999;
    animation: slideDown 0.2s ease;
  }
  [data-theme="light"] #mobile-menu { background: rgba(244,246,255,0.97); }
  #mobile-menu.open { display: flex; }

  #mobile-menu a {
    padding: 0.7rem 1rem;
    border-radius: 10px;
    color: var(--muted);
    font-weight: 500;
    font-size: 0.95rem;
    transition: all var(--t);
  }
  #mobile-menu a:hover { color: var(--text); background: var(--card); }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ============================================================
     SCROLL REVEAL
     ============================================================ */
  /* Reveal: hidden by default only when JS has run (js-reveal class on html) */
  .js-reveal .reveal {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.65s ease, transform 0.65s ease;
  }
  .js-reveal .reveal.visible { opacity: 1; transform: translateY(0); }
  .js-reveal .reveal-delay-1 { transition-delay: 0.1s; }
  .js-reveal .reveal-delay-2 { transition-delay: 0.2s; }
  .js-reveal .reveal-delay-3 { transition-delay: 0.3s; }
  .js-reveal .reveal-delay-4 { transition-delay: 0.4s; }
  .js-reveal .reveal-delay-5 { transition-delay: 0.5s; }
  .js-reveal .reveal-left { opacity: 0; transform: translateX(-30px); transition: opacity 0.65s ease, transform 0.65s ease; }
  .js-reveal .reveal-left.visible { opacity: 1; transform: translateX(0); }

  /* ============================================================
     SHARED CARD STYLE
     ============================================================ */
  .glass-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    transition: background var(--t), border-color var(--t), transform var(--t), box-shadow var(--t);
    will-change: transform;
  }
  .glass-card:hover {
    background: var(--card-hover);
    border-color: var(--border-hover);
    box-shadow: var(--glow-blue);
    transform: translateY(-4px);
  }
  [data-theme="light"] .glass-card {
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  [data-theme="light"] .glass-card:hover {
    box-shadow: 0 8px 28px rgba(79,142,247,0.12), 0 2px 8px rgba(0,0,0,0.06);
  }

  /* ============================================================
     BUTTONS
     ============================================================ */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.75rem;
    border-radius: 12px;
    background: var(--blue);
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    transition: all var(--t);
    border: 1px solid transparent;
    will-change: transform;
  }
  .btn-primary:hover {
    background: #3a7cf0;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(79,142,247,0.35);
  }
  [data-theme="light"] .btn-primary:hover {
    box-shadow: 0 6px 20px rgba(79,142,247,0.3);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.75rem;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 600;
    font-size: 0.95rem;
    transition: all var(--t);
    will-change: transform;
  }
  .btn-secondary:hover {
    background: var(--card-hover);
    border-color: var(--border-hover);
    transform: translateY(-2px);
  }
  [data-theme="light"] .btn-secondary {
    background: rgba(255,255,255,0.9);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  [data-theme="light"] .btn-secondary:hover {
    background: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }

  /* ============================================================
     SHARED SECTION HEADING
     ============================================================ */
  .section-label {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 0.75rem;
  }
  .section-label::before {
    content: '';
    width: 20px; height: 2px;
    background: var(--blue);
    border-radius: 2px;
  }

  .section-title {
    font-family: var(--font-display);
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 1rem;
  }

  /* ============================================================
     SHARED FOOTER
     ============================================================ */
  .site-footer {
    margin-top: 5rem;
    padding: 3rem 2rem 2rem;
    border-top: 1px solid var(--border);
    text-align: center;
    transition: border-color var(--t);
  }
  [data-theme="light"] .site-footer {
    background: linear-gradient(to bottom, transparent, rgba(79,142,247,0.03));
  }

  .footer-socials {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 2rem;
  }

  .footer-social-link {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--t);
  }
  .footer-social-link:hover {
    background: var(--card-hover);
    border-color: var(--border-hover);
    transform: translateY(-3px);
    box-shadow: var(--glow-blue);
  }
  .footer-social-link img {
    width: 20px; height: 20px;
    filter: invert(0.6) brightness(1.2);
    transition: filter var(--t);
  }
  [data-theme="light"] .footer-social-link img {
    filter: invert(0.3) brightness(0.9);
  }
  [data-theme="light"] .footer-social-link:hover img {
    filter: none;
  }

  .footer-copy {
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 900px) {
    #desktop-nav { display: none; }
    #menu-toggle { display: flex; }
    .header-inner { padding: 0 1.25rem; }
  }
  @media (max-width: 480px) {
    .logo-name { display: none; }
  }
</style>
